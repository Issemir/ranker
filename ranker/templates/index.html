<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranker - Swiss Bracket Voting</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div>
                    <h1><a href="/dashboard">🏆 Ranker</a></h1>
                    <p>Rank items using Swiss-bracket voting</p>
                </div>
                <div class="header-nav">
                    <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
                    <button id="logout-btn" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Start Screen -->
            <section id="start-screen" class="screen active">
                <div class="start-content">
                    <h2>Ready to Rank!</h2>
                    <p>You have a file ready to rank. Click the button below to begin voting.</p>
                    <button id="start-btn" class="btn btn-primary btn-lg">Start Ranking</button>
                    <p style="margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.95rem;">
                        <a href="/dashboard" style="color: var(--primary-color);">← Back to Dashboard</a>
                    </p>
                </div>
            </section>

            <!-- Voting Screen -->
            <section id="voting-screen" class="screen">
                <div class="voting-container">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    
                    <div class="round-info">
                        <span id="round-display">Round 1</span>
                        <span id="match-display">Match 1/2</span>
                    </div>

                    <div class="voting-area">
                        <button id="option1-btn" class="option-btn option-left">
                            <span class="option-number">1</span>
                            <span id="option1-text" class="option-text">Option 1</span>
                        </button>

                        <div class="vs-divider">VS</div>

                        <button id="option2-btn" class="option-btn option-right">
                            <span class="option-number">2</span>
                            <span id="option2-text" class="option-text">Option 2</span>
                        </button>
                    </div>

                    <div class="voting-hints">
                        <p>Press <kbd>1</kbd> or <kbd>2</kbd> to vote, or click above</p>
                    </div>
                </div>
            </section>

            <!-- Results Screen -->
            <section id="results-screen" class="screen">
                <div class="results-container">
                    <h2>Final Rankings</h2>
                    <div id="rankings-list" class="rankings-list">
                        <!-- Rankings will be inserted here -->
                    </div>
                    <div class="results-save">
                        <input type="text" id="session-name" placeholder="Name this ranking (optional)" class="session-input">
                        <button id="save-btn" class="btn btn-secondary">Save to History</button>
                    </div>
                    <div class="results-actions">
                        <button id="export-btn" class="btn btn-secondary">Export Results</button>
                        <button id="restart-btn" class="btn btn-primary">Start Again</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
