<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ranker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏆 Ranker</h1>
            <p>Swiss Bracket Ranking System</p>
        </header>

        <main class="main-content">
            <div class="auth-container">
                <div class="auth-card">
                    <h2>Create Your Account</h2>
                    
                    <form id="register-form" class="auth-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="you@example.com">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
                            <small>At least 6 characters</small>
                        </div>

                        <div class="form-group">
                            <label for="password-confirm">Confirm Password</label>
                            <input type="password" id="password-confirm" name="password-confirm" required placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                    </form>

                    <div id="error-message" class="error-message"></div>
                    <div id="success-message" class="success-message"></div>

                    <div class="auth-footer">
                        <p>Already have an account? <a href="/login">Login here</a></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("password-confirm").value;
            const errorDiv = document.getElementById("error-message");
            const successDiv = document.getElementById("success-message");

            if (password !== passwordConfirm) {
                errorDiv.textContent = "Passwords don't match";
                return;
            }

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, password_confirm: passwordConfirm })
                });

                const data = await response.json();

                if (response.ok) {
                    errorDiv.textContent = "";
                    successDiv.textContent = "Account created! Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || "Registration failed";
                    successDiv.textContent = "";
                }
            } catch (error) {
                errorDiv.textContent = "Error: " + error.message;
                successDiv.textContent = "";
            }
        });
    </script>
</body>
</html>
